# Ingress gatekeeper for the therm add-on.
#
# Home Assistant requires an Ingress app to accept connections only from the
# Ingress gateway (172.30.32.2) and deny everything else: other add-ons share
# the internal network and could otherwise reach Streamlit directly, without
# Home Assistant's login. Streamlit itself listens on 127.0.0.1:8502 only.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Ingress rejects request bodies over 16 MiB anyway.
    client_max_body_size 16m;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8501;

        allow 172.30.32.2;   # Home Assistant Ingress
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8502;
            proxy_http_version 1.1;
            # Streamlit talks to the browser over a WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
